services:
  - type: web
    name: ethiopian-dating-bot
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app
    envVars:
      - key: BOT_TOKEN
        value: your_telegram_bot_token_from_BotFather
      - key: DATABASE_URL
        fromDatabase:
          name: dating_bot_db
          property: connectionString
      - key: WEBHOOK_URL
        value: https://your-render-app-name.onrender.com/
      - key: PORT
        value: 10000
      - key: ADMIN_IDS
        value: "123456789"  # Your Telegram User ID for admin access
